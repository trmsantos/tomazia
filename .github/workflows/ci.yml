# CI do Bar da Tomazia.
#
# `ubuntu-24.04` fixo, não `ubuntu-latest`: a imagem "latest" muda debaixo
# dos pés, sem aviso, e pode partir o build sem nenhuma alteração nossa.
# Revê este pin quando o GitHub anunciar a descontinuação do `ubuntu-24.04`
# nos runners hospedados, ou quando sair uma imagem para o `ubuntu-26.04`
# (a LTS seguinte, prevista para abril de 2026) — o que vier primeiro.
#
# Nomes dos cinco jobs (backend, frontend, contrato, seguranca, resumo) são
# um contrato público: ficam exatamente assim. O `resumo` nunca se
# renomeia — vai ser o único check obrigatório de branch protection no dia
# em que houver GitHub Pro, e assim acrescentar jobs nunca obriga a mexer
# na lista de checks exigidos.
#
# Porque `git status --porcelain --untracked-files=all`, e não `git diff
# --exit-code`, nas guardas "o ficheiro gerado não mudou" abaixo
# (requirements.txt, frontend/src/lib/api): o `git diff --exit-code` só
# compara o que já está versionado — não vê um ficheiro apagado (deixa de
# existir, não há diff nenhum a mostrar) nem um ficheiro novo por
# versionar. Um `requirements.txt` apagado, ou um tipo novo gerado em
# `src/lib/api` e nunca commitado, passariam a verde. Cada uso abaixo
# aponta só para aqui.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancela execuções anteriores em PRs (poupa minutos num branch que
  # recebe vários pushes seguidos), mas nunca na main: o resultado do CI
  # na main é a precondição do deploy.yml (F1-04), e cancelar essa
  # execução a meio deixaria a main sem um resultado de CI válido.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Instalar o uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Sem `python-version`: o uv lê `backend/.python-version` sozinho.
          cache-dependency-glob: backend/uv.lock

      - name: uv lock --check (pyproject.toml editado sem relock)
        run: |
          if ! uv lock --check; then
            echo "::error::backend/uv.lock está desatualizado em relação a backend/pyproject.toml. Corrige com: cd backend && uv lock"
            exit 1
          fi

      - name: uv sync --frozen
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app passenger_wsgi.py

      - name: pytest
        run: uv run pytest -q

      - name: requirements.txt em dia (o que o cPanel instala = o que o CI testou)
        run: |
          # COM hashes (decisão do Tomás, F1-04): é o único salto da cadeia
          # sem verificação de integridade — o uv.lock está preso, o CI
          # testa com --frozen, o pacote é verificado byte a byte (S-12/
          # S-10)... e depois o cPanel ia buscar os pacotes Python à rede
          # sem confirmar nada. Este passo tem de usar EXATAMENTE o mesmo
          # comando do passo de prova mais abaixo ("pip install
          # --require-hashes"), senão um fica vermelho por nada.
          uv export --no-dev --format requirements-txt -o requirements.txt
          # Porquê `git status --porcelain`, não `git diff --exit-code`:
          # ver o comentário no cabeçalho deste ficheiro.
          if [ -n "$(git status --porcelain --untracked-files=all -- requirements.txt)" ]; then
            echo "::error::backend/requirements.txt ficou diferente do gerado agora (ou foi apagado). Corrige com: cd backend && uv export --no-dev --format requirements-txt -o requirements.txt — e faz commit do resultado NO MESMO PR: um PR do Dependabot no ecossistema uv nasce vermelho de propósito até esse commit, não é avaria do CI."
            git status --porcelain --untracked-files=all -- requirements.txt
            exit 1
          fi

      - name: pip install --require-hashes --dry-run (integridade + plataforma do servidor)
        run: |
          # Prova que requirements.txt é internamente consistente e
          # instalável em Linux x86_64 com Python 3.11 — a mesma
          # plataforma do cPanel. Se a resolução universal do uv não
          # cobrir essa plataforma, descobre-se aqui, não no primeiro
          # deploy. Usa o Python 3.11 que o passo "Instalar o uv" já
          # deixou pronto (lido de .python-version) e o `pip` real da
          # stdlib (venv), nunca `uv pip`: é o `pip` a sério que o Setup
          # Python App do cPanel usa.
          python_bin="$(uv python find 3.11)"
          "${python_bin}" -m venv --upgrade-deps "${RUNNER_TEMP}/prova-hashes"
          "${RUNNER_TEMP}/prova-hashes/bin/python" -m pip install --require-hashes --dry-run -r requirements.txt

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Instalar o Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test -- --run

      - name: build
        run: npm run build

      # Monta o pacote de deploy a sério (o mesmo deploy/montar.sh que o
      # deploy.yml usa, com o SHA real deste commit) e corre os dois
      # guardas sobre ele, não só sobre frontend/dist: um `.env`/`.db`
      # plantado em `backend/app/`, ou um `docs/`/`tests/`/`.claude/` que
      # sobreviva à cópia de `backend/`, nunca chegaria a aparecer num
      # guarda que só olhasse para `dist/`.
      #
      # Isto corre DEPOIS do `npm ci`, e de propósito — aqui o objetivo é
      # exercitar o script e os guardas, e o pacote é deitado fora no fim.
      # Não é o que o `deploy.yml` faz, nem pode passar a ser: lá a
      # montagem vive no job `publicar`, a partir de um checkout que o npm
      # nunca tocou (ADR 0005). Nunca levar este padrão de volta para o
      # caminho que publica.
      - name: deploy/montar.sh (pacote de deploy, para os guardas S-12/S-10)
        working-directory: ${{ github.workspace }}
        run: deploy/montar.sh --sha "${{ github.sha }}" --saida "${{ runner.temp }}/pacote-ci"

      - name: S-12 (pacote de deploy — .claude/, CLAUDE.md, docs/, tests/, e2e/)
        working-directory: ${{ github.workspace }}
        run: .github/scripts/verificar-ficheiros-proibidos.sh --conjunto s12 --pasta "${{ runner.temp }}/pacote-ci"

      - name: S-10 (pacote de deploy — .db, .sqlite, .env)
        working-directory: ${{ github.workspace }}
        run: .github/scripts/verificar-ficheiros-proibidos.sh --conjunto s10 --pasta "${{ runner.temp }}/pacote-ci"

      - name: size
        run: npm run size

      - name: S-10 (pasta de build, apanha o que não está versionado)
        run: ${{ github.workspace }}/.github/scripts/verificar-ficheiros-proibidos.sh --pasta dist

  contrato:
    name: contrato
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Não é segredo: só o suficiente para `app.main.criar_app()` (corrida
      # ao importar `app.main`, o que `python -m app.openapi` faz) não
      # rebentar à procura de AMBIENTE, que passou a ser obrigatório na
      # F1-02. "producao" falharia aqui à mesma: `Definicoes` exige um
      # SEGREDO_SESSAO forte nesse ambiente, e este job não define nenhum.
      AMBIENTE: desenvolvimento
      # Caminho que nunca existe: garante que nenhum `.env` real (do
      # repositório ou do runner) é lido, para este job ser hermético.
      # Usa `github.workspace` e não `runner.temp`: o contexto `runner` não
      # existe em `env` ao nível do job, e o GitHub rejeita o ficheiro
      # inteiro antes de criar um único job.
      TOMAZIA_ENV_FILE: ${{ github.workspace }}/tomazia-ci-sem-ambiente/.env
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Instalar o uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: backend/uv.lock

      - name: uv sync --frozen
        working-directory: backend
        run: uv sync --frozen

      # A ordem importa: o OpenAPI tem de ser exportado ANTES do
      # `gerar-api`. `frontend/openapi.json` está no `.gitignore`, por isso
      # nunca vem do checkout — só existe neste job depois deste passo.
      - name: Exportar o OpenAPI (python -m app.openapi)
        working-directory: backend
        run: uv run python -m app.openapi

      # O `gerar-api` ainda é um placeholder (a geração a sério é a
      # F2-09); estas duas guardas dão dentes ao job desde já.
      - name: OpenAPI exportado é JSON válido
        run: jq empty frontend/openapi.json

      - name: OpenAPI tem a rota /health
        run: jq -e '.paths["/health"]' frontend/openapi.json

      - name: Instalar o Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: gerar-api
        working-directory: frontend
        run: npm run gerar-api

      # Porquê `git status --porcelain`, não `git diff --exit-code`: ver o
      # comentário no cabeçalho deste ficheiro.
      - name: frontend/src/lib/api não mudou
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- frontend/src/lib/api)" ]; then
            echo "::error::frontend/src/lib/api ficou diferente depois de 'npm run gerar-api'. Corrige com: cd frontend && npm run gerar-api && git add src/lib/api"
            git status --porcelain --untracked-files=all -- frontend/src/lib/api
            exit 1
          fi

  seguranca:
    name: seguranca
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: S-10 (ficheiros versionados no repositório)
        run: ${{ github.workspace }}/.github/scripts/verificar-ficheiros-proibidos.sh --git

      - name: Instalar o Node (só para o lockfile; sem npm ci)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Auditoria npm (allowlist em .github/auditoria-npm-permitidas.json)
        run: ${{ github.workspace }}/.github/scripts/auditar-npm.sh

      - name: Instalar o uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-dependency-glob: backend/uv.lock

      - name: pip-audit (backend/requirements.txt)
        run: uvx pip-audit --no-deps --strict -r backend/requirements.txt

      - name: shellcheck -x (deploy/*.sh, .github/scripts/*.sh)
        run: |
          # `nullglob`: um glob que não encontra nada vira array vazio, em
          # vez de ficar como o texto literal do padrão (que o shellcheck
          # trataria como "ficheiro não encontrado" — um erro diferente do
          # que este passo quer apanhar). Contagem mínima explícita: um
          # glob vazio sai 0 do `for`/array sem nunca correr o shellcheck,
          # e "não correu nada" não pode ficar verde silenciosamente.
          shopt -s nullglob
          ficheiros=(deploy/*.sh .github/scripts/*.sh)
          if [ "${#ficheiros[@]}" -eq 0 ]; then
            echo "::error::Nenhum script encontrado para o shellcheck (glob vazio) — isto não verificou nada."
            exit 1
          fi
          echo "A verificar ${#ficheiros[@]} ficheiro(s): ${ficheiros[*]}"
          shellcheck -x "${ficheiros[@]}"

  resumo:
    name: resumo
    needs: [backend, frontend, contrato, seguranca]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Escrever a tabela e decidir o resultado
        env:
          RESULTADO_BACKEND: ${{ needs.backend.result }}
          RESULTADO_FRONTEND: ${{ needs.frontend.result }}
          RESULTADO_CONTRATO: ${{ needs.contrato.result }}
          RESULTADO_SEGURANCA: ${{ needs.seguranca.result }}
        run: |
          set -euo pipefail

          {
            echo "## Resumo do CI"
            echo
            echo "| Job | Resultado |"
            echo "| --- | --- |"
            echo "| backend | ${RESULTADO_BACKEND} |"
            echo "| frontend | ${RESULTADO_FRONTEND} |"
            echo "| contrato | ${RESULTADO_CONTRATO} |"
            echo "| seguranca | ${RESULTADO_SEGURANCA} |"
          } >>"${GITHUB_STEP_SUMMARY}"

          # Recusa por omissão, não aceita por omissão: o `resumo` é o
          # único check obrigatório de branch protection, para sempre
          # (ver o comentário no topo do ficheiro). Um `if:` ou um filtro
          # de caminhos acrescentado mais tarde a um job pode deixá-lo
          # `skipped`; listar só `failure | cancelled` como maus
          # resultados deixaria esse job "skipped" contar como passagem,
          # e o merge ficaria autorizado com esse guarda por correr. Só
          # `success` conta como passagem; tudo o resto (`failure`,
          # `cancelled`, `skipped`, ou qualquer valor novo que o GitHub
          # venha a introduzir) falha o resumo.
          falhou=0
          for resultado in "${RESULTADO_BACKEND}" "${RESULTADO_FRONTEND}" "${RESULTADO_CONTRATO}" "${RESULTADO_SEGURANCA}"; do
            case "${resultado}" in
              success)
                ;;
              *)
                falhou=1
                ;;
            esac
          done

          if [ "${falhou}" -eq 1 ]; then
            echo "::error::Pelo menos um job do CI não passou (falhou, foi cancelado, ou ficou skipped)."
            exit 1
          fi
