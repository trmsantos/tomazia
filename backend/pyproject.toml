[project]
name = "tomazia-backend"
version = "0.1.0"
description = "API do Bar da Tomazia"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "sqlalchemy>=2",
    "alembic",
    "pydantic-settings",
    "a2wsgi>=1.10.10",
    # ADR 0010: o corte do dia de `GET /eventos` é a meia-noite em
    # `Europe/Lisbon`, e o `zoneinfo` lê esse nome da base de dados de
    # fusos do sistema — que no cPanel partilhado não é nossa e pode não
    # existir. Sem ela, `ZoneInfo("Europe/Lisbon")` levanta
    # `ZoneInfoNotFoundError`. O `tzdata` é um pacote só de dados, puro
    # Python, e torna o comportamento independente da máquina.
    "tzdata",
    # F2-04 (autenticação): `docs/ESPECIFICACAO.md` fixa argon2id para o
    # hash das passwords dos admins. Adicionado já pela F2-04 porque os
    # testes de login precisam de criar uma conta com um hash verdadeiro
    # (não há rota de registo — S-05 — por isso os testes semeiam a conta
    # diretamente, em `tests/apoio_auth.py::registar_admin`); o serviço de
    # autenticação em `app/services/auth.py` é quem o usa em produção.
    "argon2-cffi",
    # F2-04 (autenticação), decisão do Tomás de 4 de novembro de 2026: o
    # cookie de sessão é assinado com `itsdangerous`, não com `hmac` escrito
    # à mão — num primitivo de segurança, código revisto por muita gente em
    # vez de trinta linhas nossas.
    "itsdangerous",
]

[dependency-groups]
dev = [
    "uvicorn",
    "pytest",
    "httpx",
    "ruff",
    "mypy",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
# E501 (linha longa): o `ruff format` já trata do comprimento do código;
# esta regra só sobra para comentários, docstrings e strings, que o
# formatador não consegue (nem deve) partir sozinho.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
