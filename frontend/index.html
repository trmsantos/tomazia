    <!--
      As duas faces, e só essas: as duas estão acima da dobra (o nome do bar é
      Bricolage e a ementa é DM Sans). O `crossorigin` é obrigatório mesmo na
      mesma origem — sem ele o browser descarrega a fonte duas vezes e o
      preload fica pior que nada.
    -->
    <link
      rel="preload"
      href="/fontes/dm-sans-v4_004-latin-400-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fontes/bricolage-grotesque-v1_001-latin-700-800.woff2"
      as="font"
      type="font/woff2"
      crossorigin
