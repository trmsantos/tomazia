# Responde a @claude em issues e PRs. Corre só no GitHub; nunca toca no servidor.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Recomendação para quando o CLAUDE_CODE_OAUTH_TOKEN existir e
          # puder ser testado ao vivo num PR descartável: acrescentar
          # `persist-credentials: false` aqui. Fecha o único caminho em
          # que o GITHUB_TOKEN deste job (contents: write, pull-requests:
          # write) fica ao alcance de código de terceiros — um
          # `postinstall` malicioso durante um `npm ci` dentro da própria
          # ação do Claude. Não entra sem essa prova: sem o token
          # configurado não se consegue verificar que a ação continua a
          # buscar o branch do PR num repositório privado sem as
          # credenciais persistidas do checkout.
      - uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1 (v1.0.256)
        with:
          # Token da subscrição (claude setup-token). Com API key: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 40"
