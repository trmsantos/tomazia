# Três ecossistemas: Actions (raiz), npm (frontend/) e uv (backend/).
#
# O ecossistema do backend é "uv", não "pip": é o que atualiza
# `pyproject.toml` e `uv.lock` juntos. O "pip" mexeria em
# `requirements.txt`, que é gerado (`uv export`, no job `backend` do CI) e
# nunca se edita à mão.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(acoes)"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(frontend)"
    # Tetos de versão. Cada um existe por uma razão escrita, e cada um tem
    # uma condição para sair daqui — ver `docs/decisoes/0007-tetos-de-
    # versao-do-frontend.md`. Um `ignore` sem data de validade transforma-
    # se em dívida silenciosa; estas têm o critério de levantamento no ADR.
    # São quatro entradas para três razões — o `eslint` e o `@eslint/js`
    # sobem juntos e caem pelo mesmo motivo.
    #
    # Sem isto, o Dependabot propõe-nos todos num grupo só, o `npm ci`
    # rebenta com ERESOLVE por causa do eslint, e essa falha esconde que
    # os outros dois também não deviam entrar — foi o que aconteceu no
    # PR #6.
    ignore:
      # O salto para a v4 não é uma atualização, é outra ferramenta: a
      # configuração passa a ser em CSS e o `tailwind.config.ts` deixa de
      # ser lido. Fica na 3.4 por decisão do Tomás.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # Os tipos acompanham o runtime: o `.nvmrc` diz 22, logo os tipos
      # são de Node 22. Um major aqui descreve um Node que não corremos.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # O `eslint-plugin-jsx-a11y` declara `peer eslint@"^3 || ... || ^9"`.
      # Com o eslint 10 o `npm ci` não resolve de todo.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # O `@typescript-eslint/parser` declara
      # `peer typescript@">=4.8.4 <6.1.0"`. Com o TypeScript 7 o `npm ci`
      # rebenta com ERESOLVE — e, pior, essa falha esconde as outras sete
      # subidas do mesmo grupo, que é exactamente o que o comentário acima
      # descreve a propósito do eslint e do PR #6. Medido no PR #33.
      #
      # Sai daqui no dia em que o `@typescript-eslint` abrir o intervalo
      # para o TypeScript 7 — não quando o TypeScript 7 sair, que já saiu.
      #
      # **Major e menor**, e é aqui que este teto difere dos outros quatro:
      # o intervalo deles acaba em `<6.1.0`, que é um limite **menor**. Uma
      # subida de 6.0 para 6.1 rebenta o `npm ci` exactamente como o 7, e um
      # `ignore` só de major deixava-a passar — um teto que não cobre o modo
      # de falha é pior do que nenhum, porque dá a impressão de o cobrir.
      # As correções (6.0.x) continuam a chegar.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

    groups:
      dependencias-de-desenvolvimento:
        dependency-type: "development"
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(backend)"
    groups:
      dependencias-de-desenvolvimento:
        dependency-type: "development"
        patterns:
          - "*"
