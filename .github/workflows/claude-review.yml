# Revisão pelos agentes do projeto em cada PR que não seja rascunho.
# O veredito é consultivo: o merge depende do CI e do Tomás.
name: Revisão Claude

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: revisao-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revisao:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # o diff contra a main precisa do histórico
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/pronto-para-merge ${{ github.event.pull_request.number }}"
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Agent,Bash(git diff *),Bash(git log *),Bash(gh pr diff *),Bash(gh pr view *),Bash(gh pr comment *),mcp__github_inline_comment__create_inline_comment"
